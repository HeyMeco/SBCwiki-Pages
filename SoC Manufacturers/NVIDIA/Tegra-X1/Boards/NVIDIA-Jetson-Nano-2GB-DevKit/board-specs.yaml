# NVIDIA Jetson Nano 2GB Developer Kit board specifications, rendered with its SoC table by {{< board-specs >}} in _index.md.
# Schema: layouts/shortcodes/board-specs.html in the SBCwiki repo. Numbers are bare, in the unit the key names.

soc: { part: "Jetson Nano (Tegra X1)" }
memory:
  types: ["LPDDR4"]
  bus_bits: 64
  sizes_gb: [2]
storage: ["microSD"]
usb:
  - { count: 1, version: "3.0", connector: "Type-A" }
  - { count: 2, version: "2.0", connector: "Type-A" }
  - { count: 1, version: "2.0", connector: "micro-B" }
ethernet:
  - { count: 1, gbps: 1 }
display:
  outputs: ["1× HDMI"]
camera: "1× MIPI CSI-2"
gpio: "40-pin header"
power: "5 V / 3 A via USB-C"
