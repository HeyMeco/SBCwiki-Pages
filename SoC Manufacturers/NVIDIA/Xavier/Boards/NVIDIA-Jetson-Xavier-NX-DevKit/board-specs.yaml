# NVIDIA Jetson Xavier NX Developer Kit board specifications, rendered with its SoC table by {{< board-specs >}} in _index.md.
# Schema: layouts/shortcodes/board-specs.html in the SBCwiki repo. Numbers are bare, in the unit the key names.

soc: { part: "Jetson Xavier NX" }
memory:
  types: ["LPDDR4X"]
  bus_bits: 128
  sizes_gb: [8]
storage: ["microSD", "M.2 M-Key NVMe"]
pcie:
  - { count: 1, slot: "M.2 M-Key", note: "NVMe SSD" }
  - { count: 1, slot: "M.2 E-Key", note: "Wi-Fi / Bluetooth card fitted" }
usb:
  - { count: 4, version: "3.1", connector: "Type-A" }
  - { count: 1, version: "2.0", connector: "micro-B" }
ethernet:
  - { count: 1, gbps: 1 }
wifi: "802.11ac (M.2 card)"
bluetooth: "Yes (M.2 card)"
display:
  outputs: ["1× HDMI", "1× DisplayPort"]
camera: "2× MIPI CSI-2 camera connectors"
gpio: "40-pin header"
power: "19 V DC jack"
