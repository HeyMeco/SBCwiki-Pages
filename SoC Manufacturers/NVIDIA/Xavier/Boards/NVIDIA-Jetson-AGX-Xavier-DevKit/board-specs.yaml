# NVIDIA Jetson AGX Xavier Developer Kit board specifications, rendered with its SoC table by {{< board-specs >}} in _index.md.
# Schema: layouts/shortcodes/board-specs.html in the SBCwiki repo. Numbers are bare, in the unit the key names.

soc: { part: "Jetson AGX Xavier" }
memory:
  types: ["LPDDR4X"]
  bus_bits: 256
  sizes_gb: [32]
storage: ["32 GB eMMC 5.1 (on module)", "microSD / UFS card socket", "M.2 M-Key NVMe"]
pcie:
  - { count: 1, slot: "PCIe x16 (x8 electrical)", gen: 4, lanes: 8 }
  - { count: 1, slot: "M.2 M-Key", lanes: 4, note: "NVMe SSD" }
  - { count: 1, slot: "M.2 E-Key", lanes: 1, note: "Wi-Fi / LTE / 5G, plus USB 2.0, UART, I2S" }
sata: { count: 1, gen: "eSATAp (via PCIe Gen 2 x1 bridge, combined with USB 3.0)" }
usb:
  - { count: 2, version: "3.1", connector: "Type-C", note: "DisplayPort and Power Delivery" }
  - { count: 1, version: "3.0", connector: "eSATAp combo" }
ethernet:
  - { count: 1, gbps: 1 }
display:
  outputs: ["1× HDMI 2.0", "DisplayPort via USB-C"]
camera: "16-lane MIPI CSI-2 connector (up to 6 sensors, 36 virtual channels)"
gpio: "40-pin header (UART, SPI, CAN, I2C, I2S, DMIC, GPIO)"
audio: "HD Audio header"
cooling: "Fan and heatsink fitted"
dimensions_mm: { w: 105, h: 105 }
