# Rockchip/RK3668 specifications, rendered by {{< soc-specs >}} in _index.md.
# Schema: layouts/shortcodes/soc-specs.html in the SBCwiki repo. Numbers are bare, in the unit the key names.

parts:
  - name: "Rockchip RK3668"
    process_nm: 6
    cpu:
      clusters:
        - { cores: 6, core: "Cortex-A725", max_ghz: 2.5, note: "expected" }
        - { cores: 2, core: "Cortex-A520", max_ghz: 2.2, note: "expected; Rockchip rates A520 in the same class as Cortex-A73" }
      isa: "Armv9.2, 64-bit only"
      cache:
        - { level: "L3", mb: 4 }
        - { level: "SLC", mb: 4 }
        - { level: "SRAM", mb: 4 }
      notes: "SVE2 · RME, MTE, PAC, BTI"
    memory:
      types:
        - { type: "LPDDR5", mts: 8533 }
        - { type: "LPDDR5X", mts: 8533 }
        - { type: "LPDDR6", mts: 10667 }
      bus_bits: 96
      max_gb: 64
      bandwidth_gbs: 128
      notes:
        - "LPDDR5/5X: 64-bit (4×16-bit), 68 GB/s"
        - "LPDDR6: 96-bit (4×24-bit), 128 GB/s peak; Rockchip derates this to about 90 GB/s (128 × 0.88 × 0.8)"
    gpu:
      name: "Mali-G2 Pro MC4"
      max_mhz: 1100
      tflops: 1.23
      notes:
        - "Arm CSS for Mobile; clock expected"
        - "Hardware virtualization, up to 16 VMs · L2 cache, shared 4 MB SLC"
    npu:
      name: "Rockchip NPU"
      tops_sparse: 44
      tops_precision: "INT8"
      datatypes: ["INT2", "INT3", "INT4", "INT6", "INT8", "INT16", "FP4", "FP6", "FP8", "FP16"]
      notes:
        - "8.8 TOPS per core"
        - "W1.58A8, W2A8, W2A16, W4A8, W4A16"
        - "Caffe, TFLite, PyTorch, ONNX, Android NN"
        - "CNN and Transformer together · GRID-sample · MoE · speculative sampling"
    vpu:
      decode:
        - { res: "8K", fps: 120, codecs: ["H.265", "H.264", "VP9", "AV1", "AVS2"] }
      encode:
        - { res: "8K", fps: 60, codecs: ["H.264", "H.265"], note: "10-bit / YUV444" }
      notes: "VPSS · VDPP (picture quality) · AVSP (any-view stitching) · FEC (fisheye correction) · DFS (depth from stereo)"
    isp:
      count: 3
      max_mp: 24
      notes:
        - "2× 24 MP + 1× 16 MP"
        - "HDR and 3DNR, 140 dB HDR, LED flicker mitigation, 4-cell, FEC"
    camera: ["4× MIPI CSI-2 (1×4-lane/3-trio or 2×2-lane/2-trio, C-PHY/D-PHY)", "DVP"]
    display:
      max: "Up to 2× 8K@60 or 6× 4K@60"
      outputs: ["2× HDMI 2.1 / eDP 1.4 / DP combo with DSC", "1× MIPI DSI 4-lane with DSC", "USB Type-C DisplayPort"]
    storage: ["UFS 4.0 (2-lane, Gear 5B, 11.7 GB/s)", "eMMC 5.1 (HS400)", "SDIO 3.0 (HS200)", "SDMMC", "NVMe", "SFC", "SPI"]
    pcie:
      - { count: 4, gen: 5, note: "1×4-lane + 2×2-lane, 2×1-lane" }
      - { count: 5, gen: 3, note: "1×4-lane, 2×2-lane, 2×1-lane" }
    sata: { count: 4, gen: "3.1" }
    usb:
      - { count: 1, version: "3.2 Gen 2", note: "10 Gbit/s DRD, Type-C with DisplayPort" }
      - { count: 2, version: "3.0", note: "DRD" }
      - { count: 1, version: "2.0", note: "OTG" }
      - { count: 2, version: "2.0", note: "Host" }
    ethernet:
      - { count: 2, gbps: 10, note: "XGMII" }
      - { count: 2, note: "RGMII" }
    can: { count: 6 }
    io:
      - "Three 10 Gbit/s PHYs shared by PCIe 3.0, SATA, USB 3.0, DP and XGMII"
      - "I2C, I3C, SPI, UART, GPIO, DSMC"
    audio: ["SAI, 20 lanes", "20-channel ASRC", "2× 8-channel PDM"]
    security: ["Arm TrustZone (secure boot/JTAG, key ladder, cipher, HDCP)"]
    package: "TBD, 0.65 mm ball pitch"
    availability: "Engineering samples in Q1 2027"
    other:
      - { name: "Safety", value: "Dual Cortex-M52 with DCLS · error detection · BIST · secure boot and fast boot" }
