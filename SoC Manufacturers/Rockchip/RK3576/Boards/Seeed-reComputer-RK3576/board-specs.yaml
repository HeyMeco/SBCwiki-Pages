  - { count: 1, slot: "mini PCIe", note: "4G LTE, LoRaWAN or Wi-Fi HaLow module" }
usb:
  - { count: 1, version: "3.0", connector: "Type-A" }
  - { count: 3, version: "2.0", connector: "Type-A" }
  - { count: 1, connector: "Type-C", note: "OTG, DisplayPort 1.4 Alt Mode" }
ethernet:
  - { count: 2, gbps: 1, note: "one PoE-capable with add-on module" }
display:
  outputs: ["1× HDMI 2.1", "DisplayPort 1.4 via USB-C", "4-lane MIPI DSI (22-pin)"]
temperature: "0 °C to 60 °C"
storage: ["microSD", "SPI flash (bootloader)", "M.2 M-Key NVMe"]
wifi: "Wi-Fi 6 (onboard, FPC antenna)"
bluetooth: "5.4"
camera: "2× 4-lane MIPI CSI (22-pin)"
gpio: "40-pin header"
rtc: "2-pin RTC battery header"
power: ["9–19 V DC barrel jack", "PoE (powered device) with add-on module"]
