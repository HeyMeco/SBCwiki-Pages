# Radxa-Rock-4D board specifications, rendered with its SoC table by {{< board-specs >}} in _index.md.
# Schema: layouts/shortcodes/board-specs.html in the SBCwiki repo. Numbers are bare, in the unit the key names.

soc:
  name: "Rockchip RK3576 / RK3576J"
memory:
  types: ["LPDDR5"]
  sizes_gb: [2, 4, 8, 16]
storage: ["eMMC 5.1 / UFS 2.0 module connector (eMMC only on boards without SPI flash)", "microSD"]
pcie:
  - { count: 1, slot: "FPC connector", gen: "2.1", lanes: 1 }
usb:
  - { count: 1, version: "3.0", connector: "Type-A", note: "OTG/Host" }
  - { count: 1, version: "3.0", connector: "Type-A" }
  - { count: 2, version: "2.0", connector: "Type-A" }
ethernet:
  - { count: 1, gbps: 1, note: "PoE with optional PoE HAT" }
wifi: "Wi-Fi 6"
bluetooth: "5.4"
display:
  outputs: ["1× HDMI 2.1 (up to 8K@60 / 4K@120, CEC)", "1× 4-lane MIPI DSI"]
camera: ["1× 4-lane MIPI CSI (splittable into 2× 2-lane)", "1× 2-lane MIPI CSI"]
audio: "3.5 mm 4-ring headphone jack with mic input (drives 32 Ω headphones)"
gpio: ["40-pin 2.54 mm header", "Up to 5× UART, 3× SPI, 6× I2C, 1× PCM/I2S, 2× SPDIF, 7× PWM, 1× CAN, 1× ADC, 27× GPIO"]
cooling: "2-pin 1.25 mm PWM fan header"
power: ["5 V via USB Type-C (10–25 W recommended)", "5 V via GPIO pins 2 & 4", "PoE with optional PoE HAT"]
temperature: ["RK3576: 0 °C to 60 °C", "RK3576J: -40 °C to 85 °C"]
dimensions_mm: { w: 87, h: 58, d: 20 }
other:
  - { name: "Lifecycle", value: "Supply guaranteed until September 2035" }
