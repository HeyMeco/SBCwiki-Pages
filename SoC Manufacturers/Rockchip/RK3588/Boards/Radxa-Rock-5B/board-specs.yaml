# Radxa-Rock-5B board specifications, rendered with its SoC table by {{< board-specs >}} in _index.md.
# Schema: layouts/shortcodes/board-specs.html in the SBCwiki repo. Numbers are bare, in the unit the key names.

memory:
  types: [{ type: "LPDDR4X", mts: 4266 }]
  bus_bits: 64
  channels: 2
  sizes_gb: [4, 8, 16, 32]
storage: ["eMMC module connector (up to 512 GB)", "16 MB SPI flash (bootloader)", "microSD (SDR104)"]
pcie:
  - { count: 1, slot: "M.2 M-Key", gen: 3, lanes: 4, note: "2280 NVMe SSD" }
  - { count: 1, slot: "M.2 E-Key", gen: "2.1", lanes: 1 }
usb:
  - { count: 1, version: "3.1 Gen1", connector: "Type-C", note: "Power Delivery" }
  - { count: 2, version: "3.1 Gen1", connector: "Type-A" }
  - { count: 2, version: "2.0", connector: "Type-A" }
ethernet:
  - { count: 1, gbps: 2.5, note: "PCIe RTL8125; PoE with add-on PoE HAT" }
wifi: "Via standard M.2 E-Key Wi-Fi / BT modules"
display:
  outputs: ["1× HDMI 2.1 (8K@60)", "1× HDMI 2.1 (4K@60)", "1× DP via USB Type-C (4K@60)", "1× 4-lane MIPI DSI"]
  inputs: ["1× Micro HDMI 2.1 input (4K@60)"]
camera: "1× 4-lane MIPI CSI camera port (splittable into 2× 2-lane)"
audio: "4-ring 3.5 mm headphone jack (drives 32 Ω headphones) with microphone input"
gpio: "Raspberry Pi 40-pin header"
power: "USB Type-C PD 2.0 (9 V/2 A, 12 V/2 A, 15 V/2 A, 20 V/2 A); 5V on GPIO pins 2 & 4"
rtc: "Powered from external battery"
