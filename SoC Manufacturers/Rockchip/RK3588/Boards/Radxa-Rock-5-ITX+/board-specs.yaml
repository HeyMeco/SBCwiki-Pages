# Radxa-Rock-5-ITX+ board specifications, rendered with its SoC table by {{< board-specs >}} in _index.md.
# Schema: layouts/shortcodes/board-specs.html in the SBCwiki repo. Numbers are bare, in the unit the key names.

memory:
  types: [{ type: "LPDDR5", mts: 4800 }]
  bus_bits: 64
  channels: 2
  sizes_gb: [4, 8, 16, 32]
storage: ["32 GB onboard eMMC (for Roobi OS)", "2× M.2 M-Key NVMe SSD slots (2230/2242/2260/2280 and 2280/22110, PCIe 3.0 x2 each; SATA SSDs not supported)", "microSD"]
pcie:
  - { count: 2, slot: "M.2 M-Key", gen: 3, lanes: 2, note: "NVMe SSD; SATA SSDs not supported" }
  - { count: 1, slot: "M.2 E-Key", gen: "2.1", lanes: 1, note: "Wi-Fi/BT module" }
usb:
  - { count: 1, version: "3.0", connector: "Type-C", note: "USB 3.0 OTG/HOST; DP Alt Mode up to 4Kp60; no power input" }
  - { count: 4, version: "3.0", connector: "Type-A", note: "Rear I/O" }
  - { count: 2, version: "2.0", connector: "Type-A", note: "Rear I/O, shared connector with RJ45" }
  - { count: 2, version: "2.0", connector: "Type-A", note: "Via front-panel F_USB header" }
ethernet:
  - { count: 2, gbps: 2.5, note: "One port supports PoE with an additional PoE+ module" }
wifi: "Via standard M.2 E-Key Wi-Fi / BT modules"
display:
  outputs: ["1× HDMI 2.1 (8K@60)", "1× HDMI 2.1 (4K@60)", "1× DP via USB Type-C (4K@60)", "2× 4-lane MIPI DSI", "1× eDP with touch-panel interface"]
  inputs: ["1× Standard HDMI 2.1 input (4K@60)"]
camera: "2× camera ports (each 4-lane MIPI CSI, splittable into 2× 2-lane)"
audio: ["3-ring 3.5 mm headphone jack (drives 32 Ω headphones) with microphone input", "S/PDIF digital audio output", "Front-panel audio header"]
power: ["24-pin ATX power connector", "12 V DC barrel jack (5.5×2.5mm)", "4-pin Molex power output connector (12 V/GND/GND/5 V)", "PoE via add-on module (one 2.5GbE port)"]
rtc: "RTC battery holder onboard (CR1220)"
cooling: "4× cooler mount holes (75×75mm, Intel LGA115x-compatible); ATX-standard fan connector (fan tach not supported)"
dimensions_mm: { w: 170, h: 170 }
form_factor: "Mini-ITX (ATX-compatible)"
