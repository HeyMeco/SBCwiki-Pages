# Radxa-Rock-5-ITX+ board specifications, rendered with its SoC table by {{< board-specs >}} in _index.md.
# Schema: layouts/shortcodes/board-specs.html in the SBCwiki repo. Numbers are bare, in the unit the key names.

memory:
  types: [{ type: "LPDDR4X", mts: 4266 }]
  bus_bits: 64
  channels: 2
  sizes_gb: [4, 8, 16, 32]
storage: ["eMMC module connector (up to 512 GB)", "16 MB SPI flash (bootloader)", "M.2 M-Key NVMe SSD", "microSD (SDR104)"]
pcie:
  - { count: 1, slot: "x16 slot" }
  - { count: 1, slot: "M.2 M-Key", gen: 3, lanes: 4, note: "2280 NVMe SSD" }
  - { count: 1, slot: "M.2 E-Key", gen: "2.1", lanes: 1 }
usb:
  - { version: "3.1", note: "multiple ports" }
  - { version: "2.0", note: "multiple ports" }
ethernet:
  - { count: 1, gbps: 2.5, note: "PCIe RTL8125" }
wifi: "Via standard M.2 E-Key Wi-Fi / BT modules"
display:
  outputs: ["1× HDMI 2.1 (8K@60)", "1× HDMI 2.1 (4K@60)", "1× DP via USB Type-C", "1× 4-lane MIPI DSI"]
  inputs: ["4K@60 HDMI 2.1"]
camera: "2× 2-lane MIPI CSI (cameras up to 48 MP)"
gpio: "Raspberry Pi 40-pin header"
power: ["24-pin ATX power connector", "USB Type-C PD 2.0"]
rtc: "Powered from external battery"
