# Radxa-Rock-5T board specifications, rendered with its SoC table by {{< board-specs >}} in _index.md.
# Schema: layouts/shortcodes/board-specs.html in the SBCwiki repo. Numbers are bare, in the unit the key names.

memory:
  types: [{ type: "LPDDR5", mts: 4800 }]
  bus_bits: 64
  channels: 2
  sizes_gb: [4, 8, 16, 32]
storage: ["Onboard eMMC (16/32/64/128/256 GB, SKU-selected)", "microSD (SDR104)"]
pcie:
  - { count: 2, slot: "M.2 M-Key", gen: 3, lanes: 2, note: "2280 NVMe SSD each; SATA SSDs not supported" }
usb:
  - { count: 1, version: "3.0", connector: "Type-C", note: "USB 3.0 OTG/HOST; DP Alt Mode up to 4Kp60; no power input" }
  - { count: 2, version: "3.0", connector: "Type-A" }
  - { count: 2, version: "2.0", connector: "Type-A" }
ethernet:
  - { count: 1, gbps: 2.5, note: "PoE support (additional PoE module required)" }
  - { count: 1, gbps: 2.5, note: "No PoE; located near HDMI side" }
wifi: "IEEE 802.11a/b/g/n/ac/ax (Wi-Fi 6), onboard"
bluetooth: "BT 5.2 with BLE, onboard"
display:
  outputs: ["1× HDMI 2.1 (8K@60)", "1× HDMI 2.1 (4K@60)", "1× DP via USB Type-C (4K@60)", "1× 4-lane MIPI DSI"]
  inputs: ["1× Standard HDMI 2.1 input (4K@60)"]
camera: "2× camera ports (each 4-lane MIPI CSI, splittable into 2× 2-lane)"
audio: ["4-ring 3.5 mm headphone jack (drives 32 Ω headphones) with microphone input", "25-pin FPC interface (USB 2.0/I2C/PWM/PDM) for digital microphone"]
gpio: "Raspberry Pi 40-pin header"
power: "5525 DC jack, 9–20 V input (12 V recommended); 5V on GPIO pins 2 & 4; no power input via USB-C"
rtc: "Powered from external battery"
other: [{ name: "Cellular", value: "M.2 B-Key socket (USB signaling) + SIM card slot for 4G modules" }]
