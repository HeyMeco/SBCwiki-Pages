# Orange Pi 5 board specifications, rendered with its SoC table by {{< board-specs >}} in _index.md.
# Schema: layouts/shortcodes/board-specs.html in the SBCwiki repo. Numbers are bare, in the unit the key names.

soc:
  name: "Rockchip RK3588S"
memory:
  types: ["LPDDR4", "LPDDR4X"]
  sizes_gb: [4, 8, 16, 32]
storage: ["microSD", "M.2 M-Key NVMe (PCIe 2.0 x1)", "SPI flash"]
pcie:
  - { count: 1, slot: "M.2 M-Key 2230/2242", gen: 2, lanes: 1, note: "NVMe SSD, or Wi-Fi module instead" }
usb:
  - { count: 1, version: "3.1 Gen 1", connector: "Type-C", note: "DisplayPort 1.4 (multiplexed)" }
  - { count: 1, version: "3.0", connector: "Type-A" }
  - { count: 2, version: "2.0", connector: "Type-A" }
ethernet:
  - { count: 1, gbps: 1, note: "Motorcomm YT8531C" }
wifi: "Optional Wi-Fi 6 via M.2 module (AP6275P), shares the NVMe slot"
bluetooth: "Optional 5.0 via M.2 module"
display:
  outputs: ["1× HDMI 2.1 (8K@60)", "1× DisplayPort 1.4 via USB-C (8K@30)", "MIPI DSI"]
camera: "MIPI CSI camera connectors"
gpio: "26-pin header"
power: "5 V / 4 A via USB Type-C"
dimensions_mm: { w: 100, h: 62 }
