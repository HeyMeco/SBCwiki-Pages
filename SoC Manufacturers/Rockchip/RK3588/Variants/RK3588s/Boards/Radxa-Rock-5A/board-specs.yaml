# Radxa-Rock-5A board specifications, rendered with its SoC table by {{< board-specs >}} in _index.md.
# Schema: layouts/shortcodes/board-specs.html in the SBCwiki repo. Numbers are bare, in the unit the key names.

soc:
  name: "Rockchip RK3588S"
memory:
  types: [{ type: "LPDDR4X", mts: 4266 }]
  bus_bits: 64
  channels: 2
storage: ["eMMC module connector (eMMC 5.1, >8 GB, no max specified) — shares slot with an optional SPI NOR flash module (mutually exclusive)", "microSD (SDR104)"]
pcie:
  - { count: 1, slot: "M.2 E-Key", gen: "2.1", lanes: 1, note: "PCIe 2.1 or SATA, plus USB 2.0; Wi-Fi 6 module. No M.2 M-Key / NVMe slot on this board" }
usb:
  - { count: 2, version: "2.0", connector: "Type-A" }
  - { count: 1, version: "3.0", connector: "Type-A" }
  - { count: 1, version: "3.0", connector: "Type-A", note: "OTG/HOST" }
ethernet:
  - { count: 1, gbps: 1, note: "PoE with add-on PoE HAT" }
wifi: "Via standard M.2 E-Key Wi-Fi / BT modules"
display:
  outputs: ["1× Micro HDMI 2.1 (8K@60)", "1× Micro HDMI 2.1 (4K@60)", "1× 4-lane MIPI DSI"]
camera: "1× 4-lane MIPI CSI camera port (splittable into 2× 2-lane)"
audio: "4-ring 3.5 mm headphone jack (drives 32 Ω headphones) with microphone input"
gpio: "Raspberry Pi 40-pin header"
power: "USB Type-C PD 2.0 (9 V/2 A, 12 V/2 A, 15 V/2 A, 20 V/2 A) or QC 2.0/3.0 (9 V/2 A, 12 V/2 A); 5V on GPIO pins 2 & 4"
rtc: "Powered from external battery"
cooling: "2-pin 1.25 mm fan header (PWM, no tach)"
dimensions_mm: { w: 85, h: 56 }
form_factor: "Raspberry Pi-like compact SBC"
