# Radxa-Rock-5C board specifications, rendered with its SoC table by {{< board-specs >}} in _index.md.
# Schema: layouts/shortcodes/board-specs.html in the SBCwiki repo. Numbers are bare, in the unit the key names.

soc:
  name: "Rockchip RK3588S2 / RK3582"
memory:
  types: [{ type: "LPDDR4X", mts: 4266 }]
  bus_bits: 64
  channels: 2
storage: ["eMMC module connector (eMMC 5.1, >8 GB, no max specified) — shares slot with an optional SPI NOR flash module (mutually exclusive)", "microSD"]
pcie:
  - { count: 1, slot: "FPC connector", gen: "2.1", lanes: 1, note: "Requires add-on expansion board/HAT for SSD, SATA, or 2.5GbE. No M.2 slots on this board" }
usb:
  - { count: 2, version: "2.0", connector: "Type-A" }
  - { count: 1, version: "3.0", connector: "Type-A" }
  - { count: 1, version: "3.0", connector: "Type-A", note: "OTG/HOST" }
ethernet:
  - { count: 1, gbps: 1, note: "PoE with add-on PoE HAT; 2.5GbE possible via FPC expansion HAT" }
wifi: "IEEE 802.11a/b/g/n/ac/ax (Wi-Fi 6), onboard, external antenna connector"
bluetooth: "BT 5.4 with BLE, onboard"
display:
  outputs: ["1× HDMI 2.1 (8K@60)", "1× MIPI DSI (up to 2K)"]
camera: "1× 4-lane MIPI CSI camera port (splittable into 2× 2-lane)"
audio: "4-ring 3.5 mm headphone jack (drives 32 Ω headphones) with microphone input"
gpio: "Raspberry Pi 40-pin header"
power: "USB Type-C, fixed 5V input; 5V on GPIO pins 2 & 4 (no USB PD / multi-voltage support)"
rtc: "Powered from external battery"
cooling: "2-pin 1.25 mm fan header (PWM, no tach)"
dimensions_mm: { w: 85, h: 56 }
form_factor: "Raspberry Pi-like compact SBC"
