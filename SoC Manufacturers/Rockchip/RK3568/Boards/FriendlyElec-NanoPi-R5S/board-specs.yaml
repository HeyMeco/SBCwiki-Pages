# FriendlyElec NanoPi R5S board specifications, rendered with its SoC table by {{< board-specs >}} in _index.md.
# Schema: layouts/shortcodes/board-specs.html in the SBCwiki repo. Numbers are bare, in the unit the key names.

soc:
  name: "Rockchip RK3568B2"
memory:
  types: ["LPDDR4X"]
  sizes_gb: [2, 4]
storage: ["8 or 16 GB eMMC", "microSD (UHS-I)"]
pcie:
  - { count: 1, slot: "M.2 M-Key", gen: "2.1", lanes: 1, note: "NVMe or PCIe Wi-Fi" }
usb:
  - { count: 2, version: "3.2 Gen 1", connector: "Type-A" }
ethernet:
  - { count: 2, gbps: 2.5, note: "PCIe, Realtek RTL8125BG" }
  - { count: 1, gbps: 1, note: "native GMAC, RTL8211F" }
wifi: "None onboard (USB or M.2 adapter)"
display:
  outputs: ["1× HDMI 2.0 (up to 4096×2304@60)"]
gpio: "12-pin 0.5 mm FPC connector"
debugging: "3-pin debug UART (1500000 bps)"
temperature: "0 °C to 70 °C"
dimensions_mm: { w: 90, h: 62 }
weight_g: 57.5
