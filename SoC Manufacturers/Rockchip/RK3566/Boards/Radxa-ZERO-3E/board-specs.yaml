# Radxa-ZERO-3E board specifications, rendered with its SoC table by {{< board-specs >}} in _index.md.
# Schema: layouts/shortcodes/board-specs.html in the SBCwiki repo. Numbers are bare, in the unit the key names.

soc:
  notes: "CPU clocked at up to 1.6 GHz on this board"
memory:
  types: ["LPDDR4"]
  sizes_gb: [1, 2, 4, 8]
storage: ["microSD"]
usb:
  - { count: 1, version: "3.0", connector: "Type-C", note: "host" }
  - { count: 1, version: "2.0", connector: "Type-C", note: "OTG, power & data" }
ethernet:
  - { count: 1, gbps: 1, note: "PoE via optional HAT (IEEE 802.3af)" }
wifi: "n/a"
bluetooth: "n/a"
display:
  outputs: ["Micro HDMI (1080p@60)"]
camera: "1× 4-lane MIPI CSI (22-pin, 0.5mm pitch FPC)"
gpio: "40-pin header"
power: ["USB Type-C (5 V / 2 A)", "PoE"]
debugging: "UART2_M0 debug console on 40-pin header (pin 8 TX, pin 10 RX), default baud 1500000n8"
dimensions_mm: { w: 65, h: 30 }
