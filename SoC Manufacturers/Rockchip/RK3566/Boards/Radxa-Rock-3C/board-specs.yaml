# Radxa-Rock-3C board specifications, rendered with its SoC table by {{< board-specs >}} in _index.md.
# Schema: layouts/shortcodes/board-specs.html in the SBCwiki repo. Numbers are bare, in the unit the key names.

memory:
  types: ["LPDDR4", "LPDDR4X"]
  bus_bits: 32
storage: ["eMMC module connector", "microSD card slot"]
pcie:
  - { count: 1, slot: "M.2 M-Key (2230)", gen: 2, lanes: 1, note: "NVMe or SATA SSD" }
usb:
  - { count: 1, version: "2.0", connector: "Type-A", note: "OTG/host, switchable" }
  - { count: 2, version: "2.0", connector: "Type-A", note: "host" }
  - { count: 1, version: "3.0", connector: "Type-A", note: "host" }
ethernet:
  - { count: 1, gbps: 1, note: "PoE via optional HAT" }
wifi: "Wi-Fi 6 (rev V1.4); Wi-Fi 5 (rev V1.3)"
bluetooth: "BT 5.4 (rev V1.4); BT 5.0 (rev V1.3)"
display:
  outputs: ["1× HDMI (1080p@60)", "2-lane MIPI DSI"]
camera: "1× 2-lane MIPI CSI"
audio: "3.5 mm audio jack (with microphone)"
cooling: "2-pin 1.25mm fan header"
gpio: "40-pin header"
power: "USB Type-C (5 V/3 A; 5 V/4 A with M.2 SSD)"
dimensions_mm: { w: 85, h: 56 }
