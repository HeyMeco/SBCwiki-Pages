# SiEngine/SE1000 specifications, rendered by {{< soc-specs >}} in _index.md.
# Schema: layouts/shortcodes/soc-specs.html in the SBCwiki repo. Numbers are bare, in the unit the key names.

parts:
  - name: "SiEngine SE1000-I"
    process_nm: 7
    cpu:
      clusters:
        - { cores: 4, core: "Cortex-A76", max_ghz: 2.4 }
        - { cores: 4, core: "Cortex-A55", max_ghz: 1.8 }
      notes: "Cluster 0: 4× A76 + 2× A55, cluster 1: 2× A55"
    memory:
      types: ["LPDDR4", "LPDDR4X", "LPDDR5"]
      max_gb: 16
    gpu:
      name: "Mali-G76 MP10 + Mali-G76 MP4"
      vendor_apis: { opengl_es: "3.2", vulkan: "1.0", opencl: "2.0" }
      notes: "Two 3D GPUs plus a 2D/2.5D graphics core"
    npu:
      name: "Arm China Zhouyi Z2 (2 cores)"
      tops: 6.8
      notes: "NPU0 3.34 TOPS + NPU1 3.5 TOPS"
    vpu:
      decode:
        - { res: "4K", fps: 120, codecs: ["H.265", "H.264", "VP9", "AVS2"] }
      encode:
        - { res: "4K", fps: 60, codecs: ["H.265", "H.264"] }
    isp: { count: 2, mpixel_s: 800 }
    storage: ["eMMC", "UFS"]
    pcie: [{ gen: 3 }]
    dsp: "2× Cadence HiFi 5"
    other:
      - { name: "Safety", value: "ASIL-D core protection, ASIL-B display/control path" }
