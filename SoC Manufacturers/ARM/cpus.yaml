# Arm CPU core generations: the single source for the tables on the ARM page (rendered by
# {{< generation-table "<anchor>" >}} under each year heading) and for CPU core links and
# tooltips in every SoC spec table (layouts/partials/soc/linkdb.html in the SBCwiki repo).
#
# `anchor` must equal the id of the heading the table sits under (the build warns if not).
# `name` is what SoC specs match against (longest prefix wins); `aliases` match the same
# entry; `display` overrides the table text; `based_on` names the Cortex core a Neoverse
# core derives from.

columns:
  - { key: isa, label: "ISA" }
  - { key: name, label: "Name" }
  - { key: class, label: "Class" }

groups:
  - anchor: "2025"
    year: 2025
    entries:
      - name: "C1-Ultra"
        aliases: ["Cortex-X930"]
        display: "C1-Ultra (Cortex-X930)"
        isa: "ARMv9.3-A"
        class: "Flagship"
      - name: "C1-Premium"
        aliases: ["Cortex-A730"]
        display: "C1-Premium (Cortex-A730)"
        isa: "ARMv9.3-A"
        class: "High-End"
      - name: "C1-Pro"
        aliases: ["Cortex-A530"]
        display: "C1-Pro (Cortex-A530)"
        isa: "ARMv9.3-A"
        class: "Performance"
      - name: "C1-Nano"
        aliases: ["Cortex-A320"]
        display: "C1-Nano (Cortex-A320)"
        isa: "ARMv9.3-A"
        class: "Ultra Efficiency"
