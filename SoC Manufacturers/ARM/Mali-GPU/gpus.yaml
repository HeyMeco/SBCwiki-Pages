# Arm Mali GPU generations: the single source for the tables on this page (rendered by
# {{< generation-table "<anchor>" >}} under each heading) and for GPU links, tooltips and
# Mesa lookups in every SoC spec table (layouts/partials/soc/linkdb.html in the SBCwiki repo).
#
# `anchor` must equal the id of the heading the table sits under (the build warns if not).
# `name` is the canonical GPU name SoC specs match against (longest prefix wins, so
# "Mali-G610 MP4" finds "Mali-G610"); `aliases` are extra names that match the same entry;
# `display` overrides what the table shows when it differs from the name.

columns:
  - { key: arch, label: "Micro Architecture" }
  - { key: name, label: "Name" }
  - { key: class, label: "Class" }

groups:
  - anchor: "2026"
    year: 2026
    entries:
      - name: "Mali G2-Ultra-NX"
        aliases: ["Mali G2-Ultra", "Mali-G2 Ultra", "Mali-G2-Ultra"]
        display: "Mali G2-Ultra-NX"
        arch: "\"6th Gen\" Magni (v15)"
        class: "Flagship"
      - name: "Mali G2-Premium-NX"
        aliases: ["Mali G2-Premium", "Mali-G2 Premium", "Mali-G2-Premium"]
        display: "Mali G2-Premium-NX"
        arch: "\"6th Gen\" Magni (v15)"
        class: "Mid-Range"
      - name: "Mali G2-Pro-NX"
        aliases: ["Mali G2-Pro", "Mali-G2 Pro", "Mali-G2-Pro"]
        display: "Mali G2-Pro-NX"
        arch: "\"6th Gen\" Magni (v15)"
        class: "Entry"
      - name: "Mali TMEX (Immortalis)"
        arch: "\"6th Gen\" Magni (v15)"
        class: "Entry?"
