# RasperryPi 5 board specifications, rendered with its SoC table by {{< board-specs >}} in _index.md.
# Schema: layouts/shortcodes/board-specs.html in the SBCwiki repo. Numbers are bare, in the unit the key names.

memory:
  types: [{ type: "LPDDR4X", mts: 4266 }]
  sizes_gb: [4, 8]
storage: ["microSD (SDR104)"]
pcie:
  - { count: 1, gen: 2, lanes: 1, note: "Gen 3 mode possible; needs an M.2 HAT or other adapter" }
usb:
  - { count: 2, version: "3.0", connector: "Type-A" }
  - { count: 2, version: "2.0", connector: "Type-A" }
ethernet:
  - { count: 1, gbps: 1, note: "PoE+ with separate PoE+ HAT" }
wifi: "Dual-band 802.11ac"
bluetooth: "5.0 / BLE"
display:
  outputs: ["2× HDMI (4K@60, HDR)"]
camera: "2× 4-lane MIPI camera/display transceivers"
gpio: "Raspberry Pi 40-pin header"
power: "5 V / 5 A via USB-C with Power Delivery"
rtc: "Powered from external battery"
