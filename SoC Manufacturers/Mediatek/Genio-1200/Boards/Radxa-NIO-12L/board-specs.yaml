  - { count: 1, gbps: 1, note: "PoE capable" }
wifi: "Wi-Fi 6"
bluetooth: "5.4"
display:
  outputs: ["HDMI (4K@60)", "MIPI DSI"]
camera: "MIPI CSI"
gpio: "GPIO header"
