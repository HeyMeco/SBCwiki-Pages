# OpenWrt One board specifications, rendered with its SoC table by {{< board-specs >}} in _index.md.
# Schema: layouts/shortcodes/board-specs.html in the SBCwiki repo. Numbers are bare, in the unit the key names.

soc:
  name: "MediaTek MT7981B"
memory:
  types: ["DDR4"]
  sizes_gb: [1]
storage: ["256 MB SPI NAND flash", "16 MB SPI NOR flash (write-protected recovery, jumper to unlock)"]
pcie:
  - { count: 1, slot: "M.2 M-Key 2230/2242", gen: 2, lanes: 1, note: "NVMe SSD" }
usb:
  - { count: 1, version: "2.0", connector: "Type-A" }
  - { count: 1, version: "2.0", connector: "Type-C", note: "serial console (Holtek HT42B534-2)" }
ethernet:
  - { count: 1, gbps: 2.5, note: "PoE input" }
  - { count: 1, gbps: 1 }
wifi: "Dual-band Wi-Fi 6, MediaTek MT7976C (2×2 2.4 GHz + 3×3 5 GHz)"
gpio: "mikroBUS socket"
rtc: "Yes, with battery holder"
other:
  - { name: "Boot switch", value: "NAND (normal) or NOR (recovery)" }
