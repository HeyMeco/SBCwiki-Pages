# Allwinner/H3-H5 specifications, rendered by {{< soc-specs >}} in _index.md.
# Schema: layouts/shortcodes/soc-specs.html in the SBCwiki repo. Numbers are bare, in the unit the key names.

parts:
  - name: "Allwinner H5"
    process_nm: 40
    cpu:
      clusters:
        - { cores: 4, core: "Cortex-A53" }
      notes: "Cryptography extensions"
    memory: { types: ["DDR3"] }
    gpu: { name: "Mali-450 MP4", vendor_apis: { opengl_es: "2.0", openvg: "1.1" } }
    vpu:
      decode:
        - { res: "4K", fps: 30, codecs: ["H.265"] }
        - { res: "1080p", fps: 60, codecs: ["H.264", "VP8"] }
      encode:
        - { res: "1080p", fps: 30, codecs: ["H.264"] }
    display: { max: "4K@30", outputs: ["HDMI 1.4", "CVBS"] }
    ethernet: [{ count: 1, gbps: 1, note: "plus integrated 100 Mbit PHY" }]
  - name: "Allwinner H3"
    process_nm: 40
    cpu:
      clusters:
        - { cores: 4, core: "Cortex-A7" }
    memory: { types: ["DDR3"] }
    gpu: { name: "Mali-400 MP2", vendor_apis: { opengl_es: "2.0", openvg: "1.1" } }
    vpu:
      decode:
        - { res: "4K", fps: 30, codecs: ["H.265"] }
        - { res: "1080p", fps: 60, codecs: ["H.264", "VP8"] }
      encode:
        - { res: "1080p", fps: 30, codecs: ["H.264"] }
    display: { max: "4K@30", outputs: ["HDMI 1.4", "CVBS"] }
    ethernet: [{ count: 1, gbps: 1, note: "plus integrated 100 Mbit PHY" }]
  - name: "Allwinner H2+"
    process_nm: 40
    cpu:
      clusters:
        - { cores: 4, core: "Cortex-A7" }
    memory: { types: ["DDR3"] }
    gpu: { name: "Mali-400 MP2", vendor_apis: { opengl_es: "2.0", openvg: "1.1" } }
    vpu:
      decode:
        - { res: "1080p", fps: 60, codecs: ["H.265", "H.264", "VP8"] }
      encode:
        - { res: "1080p", fps: 30, codecs: ["H.264"] }
    display: { max: "1080p", outputs: ["HDMI 1.4", "CVBS"] }
    ethernet: [{ count: 1, gbps: 0.1, note: "integrated PHY" }]
