# Allwinner/A733 specifications, rendered by {{< soc-specs >}} in _index.md.
# Schema: layouts/shortcodes/soc-specs.html in the SBCwiki repo. Numbers are bare, in the unit the key names.

parts:
  - name: "Allwinner A733"
    cpu:
      clusters:
        - { cores: 2, core: "Cortex-A76", max_ghz: 2.0 }
        - { cores: 6, core: "Cortex-A55", max_ghz: 1.8 }
    memory:
      types: ["LPDDR4", "LPDDR4X", "LPDDR5"]
    gpu:
      name: "Imagination BXM-4-64 MC1"
      vendor_apis: { opengl_es: "3.2", vulkan: "1.3", opencl: "3.0" }
    npu:
      tops: 3
      datatypes: ["INT8", "INT16", "FP16"]
    vpu:
      decode:
        - { res: "4K", fps: 60, codecs: ["H.264", "H.265", "VP9"] }
      encode:
        - { res: "4K", fps: 30, codecs: ["H.264", "H.265"] }
