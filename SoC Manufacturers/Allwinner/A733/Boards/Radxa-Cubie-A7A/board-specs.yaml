# Radxa-Cubie-A7A board specifications, rendered with its SoC table by {{< board-specs >}} in _index.md.
# Schema: layouts/shortcodes/board-specs.html in the SBCwiki repo. Numbers are bare, in the unit the key names.

memory:
  types: ["LPDDR5"]
  sizes_gb: [2, 4, 6, 8, 12, 16]
storage: ["8 MB SPI NOR flash", "microSD", "eMMC/UFS module"]
pcie:
  - { count: 1, slot: "FPC connector", gen: 3, lanes: 1 }
usb:
  - { count: 1, version: "3.1", connector: "Type-A", note: "host" }
  - { count: 3, version: "2.0", connector: "Type-A", note: "host" }
  - { count: 1, version: "2.0", connector: "Type-C", note: "OTG, power input" }
ethernet:
  - { count: 1, gbps: 1, note: "PoE supported (requires external PoE HAT)" }
wifi: "Wi-Fi 6"
bluetooth: "5.4"
display:
  outputs: ["1× HDMI (4K@60)", "1× 4-lane MIPI DSI"]
camera: "1× 4-lane MIPI CSI"
audio: "3.5mm 4-pole jack (mic input, stereo output, drives 32Ω headphones)"
gpio: "40-pin header (UART, SPI, I2C, …)"
power: ["USB Type-C", "PoE (with PoE HAT)", "5V via GPIO pins 2 and 4"]
rtc: "1× 2-pin 1.25mm header"
cooling: "1× 2-pin 1.25mm fan header"
dimensions_mm: { w: 56, h: 85 }
