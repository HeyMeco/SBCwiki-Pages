# Radxa-Cubie-A7S board specifications, rendered with its SoC table by {{< board-specs >}} in _index.md.
# Schema: layouts/shortcodes/board-specs.html in the SBCwiki repo. Numbers are bare, in the unit the key names.

soc:
  notes:
    - "Radxa lists the VPU as H.265/VP9/AVS2 decode up to 4K@60, H.264 decode up to 4K@30, H.264/H.265 encode up to 4K@30"
    - "Radxa lists NPU support for INT4/INT8/INT16/FP16/BF16"
memory:
  types: ["LPDDR5"]
storage: ["microSD", "Optional onboard eMMC (up to 256 GB)"]
pcie:
  - { count: 1, slot: "FPC connector", gen: 3, lanes: 1, note: "NVMe SSD expansion" }
usb:
  - { count: 1, version: "3.2", connector: "Type-C", note: "DisplayPort Alt Mode, OTG" }
  - { count: 1, version: "2.0", connector: "Type-C", note: "power input, OTG" }
  - { count: 1, version: "2.0", connector: "Type-A" }
ethernet:
  - { count: 1, gbps: 1 }
wifi: "Wi-Fi 6"
bluetooth: "5.4"
display:
  outputs: ["1× USB-C DisplayPort Alt Mode (4K@60)"]
camera: "1× 4-lane MIPI CSI"
gpio: ["30-pin header", "15-pin header"]
power: "USB Type-C 2.0 (5 V)"
cooling: "1× fan header"
dimensions_mm: { w: 51, h: 51 }
other:
  - { name: "Co-processor", value: "RISC-V XuanTie E902 (200 MHz)" }
  - { name: "Buttons", value: "USB BOOT button" }
