# Amlogic/S805X specifications, rendered by {{< soc-specs >}} in _index.md.
# Schema: layouts/shortcodes/soc-specs.html in the SBCwiki repo. Numbers are bare, in the unit the key names.

parts:
  - name: "Amlogic S805X"
    process_nm: 28
    cpu:
      clusters:
        - { cores: 4, core: "Cortex-A53", max_ghz: 1.416 }
      notes: "Cryptography extensions"
    memory: { types: ["DDR3", "DDR4"], bus_bits: 16 }
    gpu: { name: "Mali-450 MP3", max_mhz: 666, vendor_apis: { opengl_es: "2.0", openvg: "1.1" } }
    vpu:
      name: "Amlogic Video Engine 10"
      decode:
        - { res: "1080p", fps: 60, codecs: ["H.265"] }
        - { res: "1080p", fps: 30, codecs: ["VP9", "H.264"] }
      encode:
        - { res: "1080p", fps: 30, codecs: ["H.264"] }
    display: { max: "1080p HDR", outputs: ["HDMI 2.0", "CVBS"] }
