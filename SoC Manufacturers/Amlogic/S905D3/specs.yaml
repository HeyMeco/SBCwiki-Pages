# Amlogic/S905D3 specifications, rendered by {{< soc-specs >}} in _index.md.
# Schema: layouts/shortcodes/soc-specs.html in the SBCwiki repo. Numbers are bare, in the unit the key names.

parts:
  - name: "Amlogic S905D3"
    process_nm: 12
    cpu:
      clusters:
        - { cores: 4, core: "Cortex-A55", max_ghz: 2.016 }
      notes: "Cryptography extensions"
    memory: { types: ["DDR4", "LPDDR4"], bus_bits: 32 }
    gpu:
      name: "Mali-G31"
      vendor_apis: { opengl_es: "3.2", vulkan: "1.1", opencl: "2.0" }
      notes: "Libre Computer lists MC1"
    npu: { tops: 1.2 }
    vpu:
      name: "Amlogic Video Engine 10"
      decode:
        - { res: "4K", fps: 60, codecs: ["H.265", "VP9"] }
        - { res: "4K", fps: 30, codecs: ["H.264"] }
      encode:
        - { res: "1080p", fps: 60, codecs: ["H.265", "H.264"] }
    display: { max: "4K HDR", outputs: ["HDMI 2.0", "CVBS", "MIPI DSI"] }
