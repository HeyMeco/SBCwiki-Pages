# Libre Computer Sweet Potato (AML-S905X-CC-V2) board specifications, rendered with its SoC table by {{< board-specs >}} in _index.md.
# Schema: layouts/shortcodes/board-specs.html in the SBCwiki repo. Numbers are bare, in the unit the key names.

memory:
  types: ["DDR4"]
  bus_bits: 32
  sizes_gb: [1, 2]
storage: ["microSD (UHS SDR104)", "eMMC 5.x module connector (screw mount)", "16 MB SPI NOR flash (UEFI boot firmware)"]
usb:
  - { count: 3, version: "2.0", connector: "Type-A", note: "via hub" }
  - { count: 1, version: "2.0", connector: "Type-A", note: "dual-role" }
ethernet:
  - { count: 1, gbps: 0.1, note: "PoE via header and add-on" }
display:
  outputs: ["1× HDMI 2.0 (4K HDR)"]
gpio: ["40-pin Raspberry Pi-compatible header", "8-pin ADC/GPIO header", "5-pin USB 2.0 header", "3-pin SPDIF header"]
power: "5 V / 3 A via USB Type-C; 3 W typical, 5 W full load"
debugging: "3-pin UART header"
form_factor: "Libre Computer CC form factor (Raspberry Pi 3 Model B+ footprint and mounting holes)"
dimensions_mm: { w: 85, h: 56, d: 20 }
other:
  - { name: "Firmware", value: "UEFI" }
  - { name: "Software support", value: "Until 2053" }
