# Qualcomm Adreno GPU generations: the single source for the tables on this page (rendered by
# {{< generation-table "<anchor>" >}} under each heading) and for GPU links, tooltips and
# Mesa lookups in every SoC spec table (layouts/partials/soc/linkdb.html in the SBCwiki repo).
#
# `anchor` must equal the id of the heading the table sits under (the build warns if not).
# `name` is the canonical GPU name SoC specs match against (longest prefix wins, so
# "Mali-G610 MP4" finds "Mali-G610"); `aliases` are extra names that match the same entry;
# `display` overrides what the table shows when it differs from the name.

columns:
  - { key: name, label: "Name" }
  - { key: fp32_alus, label: "FP32 ALUs" }
  - { key: socs, label: "Notable SoCs & Class" }

