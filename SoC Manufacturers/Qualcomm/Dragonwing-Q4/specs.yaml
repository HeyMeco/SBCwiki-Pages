        - { cores: 6, core: "Cortex-A55" }
    memory:
      types: [{ type: "LPDDR5", mts: 5500 }, { type: "LPDDR4X", mts: 4200 }]
      bus_bits: 32
    gpu:
      name: "Adreno 613"
      max_mhz: 738
