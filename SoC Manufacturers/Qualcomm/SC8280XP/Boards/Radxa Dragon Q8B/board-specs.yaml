# Radxa Dragon Q8B board specifications, rendered with its SoC table by {{< board-specs >}} in _index.md.
# Schema: layouts/shortcodes/board-specs.html in the SBCwiki repo. Numbers are bare, in the unit the key names.

soc:
  name: "Qualcomm Snapdragon 8cx Gen 3 (SC8280XP)"
storage: ["Boot: onboard SPI NOR flash", "1× UFS 3.1 module (Gear 4 x2)", "1× microSD"]
pcie:
  - { count: 1, slot: "M.2 M-Key 2280", gen: 3, lanes: 4 }
  - { count: 1, slot: "M.2 M-Key 2280", gen: 3, lanes: 2 }
  - { count: 1, slot: "M.2 E-Key 2230", note: "Wi-Fi 6E / BT 5.3 module; Wi-Fi 7 from board V1.3" }
  - { count: 1, slot: "FPC", gen: 3, lanes: 1 }
usb:
  - { count: 2, version: "3.2 Gen 2", connector: "Type-C", note: "DisplayPort 1.4 Alt Mode" }
  - { count: 2, version: "3.2 Gen 2", connector: "Type-A" }
  - { count: 2, version: "2.0", connector: "Type-A" }
  - { count: 1, version: "Type-C", note: "power input" }
ethernet:
  - { count: 2, gbps: 2.5, note: "RJ45, QPS615 PCIe bridge, AVB/TSN" }
wifi: "Via M.2 E-Key module"
display:
  outputs: ["1× HDMI 2.1 (4K@120)", "2× USB-C DisplayPort 1.4 Alt Mode (4K@120)"]
camera: "1× 50-pin board-to-board connector (PCIe / MIPI CSI / I2C)"
audio: ["3.5 mm headphone jack", "Microphone connector"]
gpio: "40-pin header (UART, I2C, SPI, GPIO)"
power: ["USB Type-C, 20 V", "12–20 V power header with external power-button pin"]
rtc: "RTC battery connector"
cooling: "Fan connector"
dimensions_mm: { w: 100, h: 75 }
other:
  - { name: "Buttons", value: "Power button, EDL button" }
