# Qualcomm/Dragonwing-IQ9 specifications, rendered by {{< soc-specs >}} in _index.md.
# Schema: layouts/shortcodes/soc-specs.html in the SBCwiki repo. Numbers are bare, in the unit the key names.
# DRAM speeds are data rates in MT/s. Qualcomm quotes LPDDR clocks in MHz, so their figures are doubled here.

parts:
  - name: "QCS9075 / QCS9100"
    codename: "Lemans"
    cpu:
      clusters:
        - { cores: 8, core: "Kryo Gen 6", max_ghz: 2.36 }
    memory:
      types: [{ type: "LPDDR5", mts: 6400 }]
      bus_bits: 96
      max_gb: 36
      ecc: "inline"
      notes: "6× 16-bit"
    gpu:
      name: "Adreno 663"
      max_mhz: 800
    npu:
      name: "Hexagon"
      tops_dense: 100
      tops_precision: "INT8"
      notes: "Llama 2 7B: 22 tokens/s"
    vpu:
      decode:
        - { res: "8K", fps: 60, codecs: ["AV1", "H.264", "H.265", "VP9", "MPEG2"], note: "1×; or 2× 8K30, 4× 4K60" }
      encode:
        - { res: "4K", fps: 60, codecs: ["H.264", "H.265"], note: "2×; or 4× 4K30" }
    ethernet:
      - { count: 2, gbps: 2.5 }
    can: { count: 8, fd: true }
