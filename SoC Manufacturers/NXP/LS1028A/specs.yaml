# NXP/LS1028A specifications, rendered by {{< soc-specs >}} in _index.md.
# Schema: layouts/shortcodes/soc-specs.html in the SBCwiki repo. Numbers are bare, in the unit the key names.

parts:
  - name: "NXP Layerscape LS1028A"
    cpu:
      clusters:
        - { cores: 2, core: "Cortex-A72", max_ghz: 1.3 }
    memory:
      types: ["DDR3L", "DDR4"]
    display:
      outputs: ["LCD controller with eDP/DP output"]
    storage: ["SD", "SPI", "I²C"]
    pcie:
      - { count: 2, gen: 3 }
    sata: { count: 1, gen: "3.0" }
    usb:
      - { version: "2.0/3.0" }
    ethernet:
      - { count: 5, gbps: 2.5, note: "TSN" }
      - { count: 1, gbps: 1, note: "TSN" }
    security: "SEC security engine, 5 Gbit/s"
    other:
      - { name: "SerDes", value: "4-10 GHz SerDes lanes" }
